name: Evidence primitives verification
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: python -I -m pip install -r requirements-test.txt
      - name: Adversarial tests
        run: python -I scripts/run_tests.py --output evidence/ci-tests.json
      - name: GenVM linter check (includes built-in Validation)
        run: python -I scripts/check_contracts.py
      - name: Preserve verification records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-records
          path: evidence/
          retention-days: 90
